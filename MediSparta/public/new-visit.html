<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log New Visit - MediSparta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- JAVASCRIPT INJECTS THE SIDEBAR AND NAVBAR HERE -->

    <main id="main-content">
        <h2 class="fade-in">Log a Clinic Visit</h2>
        <p class="fade-in" style="color: #666; margin-bottom: 20px;">Record student symptoms and dispense medication.</p>
        
        <div class="login-card fade-in" style="max-width: 600px; margin: 0;"> <!-- Reusing card style for form -->
            <form id="visitForm">
                
                <h3 style="margin-bottom: 10px; color: var(--bsu-red); border-bottom: 1px solid #ccc; padding-bottom: 5px;">Patient Details</h3>
                <label for="student_id">Student ID:</label>
                <input type="number" id="student_id" placeholder="e.g., 241001" required>

                <h3 style="margin-top: 20px; margin-bottom: 10px; color: var(--bsu-red); border-bottom: 1px solid #ccc; padding-bottom: 5px;">Visit Information</h3>
                <label for="symptoms">Symptoms / Reason for Visit:</label>
                <!-- Using a textarea instead of input for longer descriptions -->
                <textarea id="symptoms" rows="3" placeholder="e.g., Severe headache and fever" style="width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required></textarea>

                <h3 style="margin-top: 20px; margin-bottom: 10px; color: var(--bsu-red); border-bottom: 1px solid #ccc; padding-bottom: 5px;">Dispense Medication</h3>
                <label for="inventory_id">Select Item:</label>
                <select id="inventory_id">
                    <option value="">- No medication dispensed -</option>
                    <option value="501">Paracetamol (Biogesic) 500mg</option>
                    <option value="502">Ibuprofen (Medicol) 200mg</option>
                    <option value="503">Antacid (Kremil-S)</option>
                    <option value="504">Adhesive Bandages (Band-Aid)</option>
                    <option value="505">Loperamide (Diatabs) 2mg</option>
                </select>

                <label for="quantity_dispensed">Quantity Dispensed:</label>
                <input type="number" id="quantity_dispensed" value="0" min="0">

                <button type="submit" class="btn-primary" style="margin-top: 30px;">Save Visit Record</button>
            </form>
        </div>
    </main>

    <!-- Shared Layout -->
    <script src="dashboard-layout.js"></script>
    
    <!-- We will add the submission script next -->
</body>
</html>
