<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records - MediSparta</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth-guard.js"></script>
</head>
<body>

    <main id="main-content">
        <h2 class="fade-in">Student Medical Records</h2>
        <p class="fade-in" style="color: #666; margin-bottom: 20px;">Search for a student to view their clinic history.</p>

        <div class="login-card fade-in" style="max-width: 800px;">
            
            <form id="searchRecordForm" style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="number" id="search_student_id" placeholder="Enter Student ID (e.g., 241001)" required style="flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <button type="submit" class="btn-primary" style="width: auto;">Search</button>
            </form>

            <div id="errorMessage" style="display: none; color: red; text-align: center; font-weight: bold; padding: 10px;"></div>

            <div id="studentProfile" style="display: none; border-bottom: 2px solid #ccc; padding-bottom: 20px; margin-bottom: 20px;">
                <h3 style="color: var(--bsu-red); margin-bottom: 10px;">Patient Profile</h3>
                <p><strong>Name:</strong> <span id="profileName"></span></p>
                <p><strong>Student ID:</strong> <span id="profileId"></span></p>
                <p><strong>Date of Birth:</strong> <span id="profileDob"></span></p>
            </div>

            <div id="visitHistory" style="display: none;">
                <h3 style="color: var(--bsu-red); margin-bottom: 10px;">Clinic Visit History</h3>
                <table style="width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left;">
                    <thead>
                        <tr style="background-color: #f4f4f4; border-bottom: 2px solid #ccc;">
                            <th style="padding: 10px;">Date & Time</th>
                            <th style="padding: 10px;">Symptoms</th>
                            <th style="padding: 10px;">Medication Dispensed</th>
                        </tr>
                    </thead>
                    <tbody id="visitHistoryBody">
                        </tbody>
                </table>
            </div>

        </div>
    </main>

    <script src="dashboard-layout.js"></script>
    <script src="script.js"></script>
</body>
</html>
